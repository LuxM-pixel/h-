<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العمليات العقارية - H-Omran</title>
<style>
:root{
  --primary-burgundy:#4A1525;
  --secondary-burgundy:#6B1D34;
  --accent-gold:#C5A059;
  --bg-cream:#F8F6F0;
  --card-bg:#FFFFFF;
  --text-main:#2C2C2C;
  --text-light:#777;
  --border-color:#E2DBD0;
  --green:#2E7D4F;
  --orange:#C77A12;
  --blue:#2F6DA3;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:var(--bg-cream);color:var(--text-main);padding:16px}
.container{max-width:1000px;margin:0 auto}

/* الأيقونات */
[data-ico]{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ico-svg{display:block}

/* الهيدر */
header{
  background:linear-gradient(135deg,var(--primary-burgundy),var(--secondary-burgundy));
  color:#fff;padding:22px;border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:16px
}
.header-title h2{font-size:24px;margin-bottom:4px}
.header-title p{font-size:13px;color:var(--accent-gold);font-weight:600}

/* اللوحات القابلة للطي */
.panel{
  background:#fff;border-radius:12px;border:1px solid var(--border-color);
  box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:16px;border-top:4px solid var(--accent-gold)
}
.panel summary{
  list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;font-weight:700;color:var(--primary-burgundy);font-size:16px
}
.panel summary::-webkit-details-marker{display:none}
.panel summary .s-title{display:flex;align-items:center;gap:8px}
.panel summary .arrow{transition:.2s;font-size:12px;color:var(--text-light)}
.panel[open] summary .arrow{transform:rotate(180deg)}
.panel-body{padding:0 18px 18px}
.panel-tools{display:flex;justify-content:flex-end;margin-bottom:10px}

/* الأزرار */
.tool-btn{
  background:transparent;border:1px solid var(--primary-burgundy);color:var(--primary-burgundy);
  padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:.2s;
  display:inline-flex;align-items:center;gap:6px
}
.tool-btn:hover{background:var(--primary-burgundy);color:#fff}
.empty{font-size:13px;color:var(--text-light);padding:8px 0}

/* الشجرة */
.tree ul{list-style:none;padding:0}
.tree ul ul{padding-right:24px;margin-right:12px;border-right:2px solid var(--border-color)}
.tree li{position:relative;padding:5px 0}
.tree ul ul>li::before{
  content:'';position:absolute;right:-24px;top:26px;width:22px;border-top:2px solid var(--border-color)
}
.org-node{
  display:inline-flex;flex-direction:column;align-items:flex-start;text-align:right;
  background:var(--bg-cream);border:1px solid var(--border-color);border-right:4px solid var(--accent-gold);
  border-radius:8px;padding:8px 14px;cursor:pointer;min-width:150px;transition:.2s
}
.org-node:hover,.org-node:focus-visible{
  border-color:var(--primary-burgundy);box-shadow:0 4px 10px rgba(74,21,37,.12);outline:none
}
.org-node .o-title{font-weight:700;font-size:14px;color:var(--primary-burgundy)}
.org-node .o-name{font-size:12px;color:var(--text-light);margin-top:2px}

/* الأطراف الثابتة */
.parties-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.party{
  background:var(--bg-cream);border:1px solid var(--border-color);border-radius:10px;
  padding:12px;cursor:pointer;transition:.2s;text-align:right;display:flex;flex-direction:column;gap:4px
}
.party:hover,.party:focus-visible{border-color:var(--accent-gold);box-shadow:0 4px 10px rgba(74,21,37,.12);outline:none}
.party .p-type{
  align-self:flex-start;font-size:11px;background:var(--primary-burgundy);color:#fff;
  padding:2px 9px;border-radius:20px
}
.party .p-name{font-weight:700;font-size:14px;color:var(--text-main);word-break:break-word}
.party .p-note{font-size:12px;color:var(--text-light);word-break:break-word}
.party a{font-size:13px;color:var(--blue);text-decoration:none;direction:ltr;text-align:right}

/* شريط العملية */
.op-bar{
  background:linear-gradient(135deg,var(--primary-burgundy),var(--secondary-burgundy));
  color:#fff;padding:16px 20px;border-radius:12px;margin-bottom:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.1);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px
}
.header-meta{
  background:rgba(255,255,255,.1);padding:12px 16px;border-radius:8px;
  border:1px solid rgba(197,160,89,.3);min-width:260px;flex:1;max-width:340px
}
.header-meta div{font-size:13px;margin-bottom:4px}
.header-meta select{
  width:100%;margin:4px 0 8px;padding:7px;border-radius:6px;border:none;
  background:#fff;color:var(--primary-burgundy);font-weight:600
}
#countdown{color:var(--accent-gold);font-weight:bold;display:flex;align-items:center;gap:6px}
#countdown.expired{color:#ff9a9a}
.new-op-btn{
  background:var(--accent-gold);color:var(--primary-burgundy);border:none;
  padding:10px 16px;font-weight:bold;border-radius:6px;cursor:pointer;transition:.3s
}
.new-op-btn:hover{background:#d4af37;transform:translateY(-2px)}

/* حالة العملية */
.status-bar{
  background:#fff;border-radius:10px;padding:14px 18px;margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border-color);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap
}
.status-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-label{font-size:14px;color:var(--primary-burgundy);font-weight:700}
.status-bar select{
  padding:7px 10px;border-radius:6px;border:1px solid var(--border-color);
  font-weight:600;font-size:14px;background:#fff
}
.op-badge{font-size:12px;padding:4px 12px;border-radius:20px;color:#fff;font-weight:600}
.op-badge.new{background:#999}
.op-badge.progress{background:var(--orange)}
.op-badge.review{background:var(--blue)}
.op-badge.done{background:var(--green)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* أيقونات المكونات */
.section-title{font-size:15px;color:var(--primary-burgundy);font-weight:700;margin:6px 4px 10px}
.icons-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px;
  background:#fff;padding:20px;border-radius:12px;border:1px solid var(--border-color);
  box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:16px
}
.tile{
  position:relative;aspect-ratio:1;border-radius:18px;border:2px solid var(--border-color);
  background:var(--bg-cream);cursor:pointer;color:var(--primary-burgundy);
  display:flex;align-items:center;justify-content:center;transition:.2s
}
.tile:hover,.tile:focus-visible{
  transform:translateY(-3px);border-color:var(--accent-gold);
  box-shadow:0 6px 14px rgba(74,21,37,.15);outline:none
}
.tile.progress{border-color:var(--orange);color:var(--orange)}
.tile.done{border-color:var(--green);background:#F1F8F3;color:var(--green)}
.tile .dot{
  position:absolute;top:7px;left:7px;width:11px;height:11px;border-radius:50%;
  background:#c9c9c9;border:2px solid #fff
}
.tile.progress .dot{background:var(--orange)}
.tile.done .dot{background:var(--green)}
.tile .has-note{
  position:absolute;bottom:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent-gold)
}
.tile .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--primary-burgundy);color:#fff;font-size:12px;padding:5px 10px;
  border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5
}
.tile:hover .tip,.tile:focus-visible .tip{opacity:1}

/* المعايير */
.criteria{
  background:#fff;border-radius:12px;padding:18px;border:1px solid var(--border-color);
  box-shadow:0 2px 8px rgba(0,0,0,.05);border-top:4px solid var(--accent-gold)
}
.criteria-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.criteria-head h3{font-size:16px;color:var(--primary-burgundy);display:flex;align-items:center;gap:8px}
.criteria-count{font-size:12px;color:var(--text-light)}
.crit-item{
  display:flex;align-items:center;gap:10px;padding:9px 4px;
  border-bottom:1px solid var(--border-color);font-size:14px
}
.crit-item input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);flex-shrink:0}
.crit-item span{flex:1;word-break:break-word}
.crit-item.checked span{color:var(--text-light);text-decoration:line-through}
.crit-del{background:none;border:none;color:#b33;cursor:pointer;font-size:16px;padding:2px 6px}
.crit-add{display:flex;gap:8px;margin-top:12px}
.crit-add input{flex:1;padding:9px;border:1px solid var(--border-color);border-radius:6px;font-size:14px}
.crit-empty{font-size:13px;color:var(--text-light);padding:8px 0}

/* النوافذ */
.modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  justify-content:center;align-items:center;z-index:1000;padding:15px
}
.modal.open{display:flex}
.modal-content{
  background:#fff;padding:22px;border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow:auto;
  box-shadow:0 5px 20px rgba(0,0,0,.2);border-top:5px solid var(--primary-burgundy)
}
.modal-title{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-title .ico{color:var(--primary-burgundy)}
.modal-title h3{color:var(--primary-burgundy);font-size:18px}
.modal-content label{display:block;font-size:13px;margin-bottom:5px;color:var(--text-light)}
.modal-content textarea,.modal-content select,.modal-content input[type=text],.modal-content input[type=tel]{
  width:100%;padding:10px;border:1px solid var(--border-color);border-radius:6px;
  margin-bottom:14px;font-size:15px
}
.modal-content textarea{height:140px;resize:vertical}
.modal-content textarea.short{height:80px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.modal-actions button{padding:8px 16px;border-radius:5px;cursor:pointer;font-weight:bold;border:none}
.save-btn{background:var(--primary-burgundy);color:#fff}
.cancel-btn{background:#ddd;color:#333}
.del-btn{background:#fff;color:#b33;border:1px solid #b33!important;margin-inline-end:auto}

@media(max-width:600px){
  .tile .tip{display:none}
  .tree ul ul{padding-right:18px;margin-right:8px}
  .tree ul ul>li::before{right:-18px;width:16px}
}

/* الطباعة */
@media print{
  body{background:#fff;padding:0}
  .new-op-btn,.tools,.crit-add,.crit-del,.header-meta select,.status-bar select,.panel-tools{display:none!important}
  header,.op-bar{background:#fff;color:#000;box-shadow:none;border:1px solid #ccc}
  .header-title p,#countdown{color:#000}
  .icons-grid{display:none}
  .panel{break-inside:avoid}
}
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="header-title">
      <p>السكرتارية الرقمية - H-Omran</p>
      <h2>إدارة العمليات العقارية</h2>
    </div>
  </header>

  <!-- الهيكل التنظيمي -->
  <details class="panel" open>
    <summary>
      <span class="s-title"><span data-ico="building" data-size="22"></span>الهيكل التنظيمي للشركة</span>
      <span class="arrow">▼</span>
    </summary>
    <div class="panel-body">
      <div class="panel-tools">
        <button class="tool-btn" onclick="openOrgModal()">+ إضافة منصب</button>
      </div>
      <div class="tree" id="org-tree"></div>
    </div>
  </details>

  <!-- الأطراف الثابتة -->
  <details class="panel" open>
    <summary>
      <span class="s-title"><span data-ico="briefcase" data-size="22"></span>الأطراف المعنية الثابتة</span>
      <span class="arrow">▼</span>
    </summary>
    <div class="panel-body">
      <div class="panel-tools">
        <button class="tool-btn" onclick="openPartyModal()">+ إضافة طرف</button>
      </div>
      <div class="parties-grid" id="parties-grid"></div>
    </div>
  </details>

  <!-- العملية ورقمها -->
  <div class="op-bar">
    <div class="header-meta">
      <div><strong>العملية:</strong></div>
      <select id="op-select" onchange="switchOperation(this.value)" aria-label="اختيار العملية"></select>
      <div id="current-datetime">--</div>
      <div id="countdown">--</div>
    </div>
    <button class="new-op-btn" onclick="createNewOperation()">+ عملية جديدة (24 ساعة)</button>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <span class="status-label">حالة العملية:</span>
      <select id="op-status" onchange="changeOpStatus(this.value)">
        <option value="new">جديدة</option>
        <option value="progress">قيد التنفيذ</option>
        <option value="review">قيد المراجعة</option>
        <option value="done">مكتملة</option>
      </select>
      <span class="op-badge" id="op-badge">جديدة</span>
    </div>
    <div class="tools">
      <button class="tool-btn" onclick="copyReport()"><span data-ico="clipboard" data-size="16"></span>نسخ التقرير</button>
      <button class="tool-btn" onclick="shareWhatsApp()"><span data-ico="message" data-size="16"></span>واتساب</button>
      <button class="tool-btn" onclick="window.print()"><span data-ico="printer" data-size="16"></span>طباعة</button>
    </div>
  </div>

  <div class="section-title">مكونات العملية <span style="font-weight:400;color:var(--text-light);font-size:12px">(اضغطي على الأيقونة)</span></div>
  <div class="icons-grid" id="grid"></div>

  <div class="criteria">
    <div class="criteria-head">
      <h3><span data-ico="check-circle" data-size="20"></span>معايير العملية</h3>
      <span class="criteria-count" id="crit-count">0 / 0</span>
    </div>
    <div id="crit-list"></div>
    <div class="crit-add">
      <input type="text" id="crit-input" placeholder="أضيفي معيارًا جديدًا..." maxlength="150"
             onkeydown="if(event.key==='Enter')addCriterion()">
      <button class="tool-btn" onclick="addCriterion()">إضافة</button>
    </div>
  </div>
</div>

<!-- نافذة مكوّن العملية -->
<div class="modal" id="inputModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" role="dialog" aria-modal="true">
    <div class="modal-title">
      <span class="ico" id="modal-ico"></span>
      <h3 id="modal-title"></h3>
    </div>
    <label for="modal-status">الحالة</label>
    <select id="modal-status">
      <option value="new">لم يبدأ</option>
      <option value="progress">قيد التنفيذ</option>
      <option value="done">مكتمل</option>
    </select>
    <label for="modal-textarea">التفاصيل</label>
    <textarea id="modal-textarea" placeholder="اكتبي التفاصيل هنا..."></textarea>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
      <button class="save-btn" onclick="saveData()">حفظ</button>
    </div>
  </div>
</div>

<!-- نافذة المنصب -->
<div class="modal" id="orgModal" onclick="if(event.target===this)closeOrgModal()">
  <div class="modal-content" role="dialog" aria-modal="true">
    <div class="modal-title"><span class="ico" data-ico="building" data-size="30"></span><h3 id="org-modal-title">منصب</h3></div>
    <label for="org-title">المسمى الوظيفي</label>
    <input type="text" id="org-title" maxlength="60" placeholder="مثال: مدير المبيعات">
    <label for="org-name">اسم الشخص</label>
    <input type="text" id="org-name" maxlength="60" placeholder="اختياري">
    <label for="org-parent">يتبع لـ</label>
    <select id="org-parent"></select>
    <div class="modal-actions">
      <button class="del-btn" id="org-del" onclick="deleteOrg()">حذف</button>
      <button class="cancel-btn" onclick="closeOrgModal()">إلغاء</button>
      <button class="save-btn" onclick="saveOrg()">حفظ</button>
    </div>
  </div>
</div>

<!-- نافذة الطرف -->
<div class="modal" id="partyModal" onclick="if(event.target===this)closePartyModal()">
  <div class="modal-content" role="dialog" aria-modal="true">
    <div class="modal-title"><span class="ico" data-ico="briefcase" data-size="30"></span><h3 id="party-modal-title">طرف معني</h3></div>
    <label for="party-name">الاسم</label>
    <input type="text" id="party-name" maxlength="80" placeholder="اسم الشخص أو الجهة">
    <label for="party-type">النوع</label>
    <select id="party-type"></select>
    <label for="party-phone">رقم الجوال</label>
    <input type="tel" id="party-phone" maxlength="25" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right">
    <label for="party-note">ملاحظة</label>
    <textarea id="party-note" class="short" maxlength="200" placeholder="اختياري"></textarea>
    <div class="modal-actions">
      <button class="del-btn" id="party-del" onclick="deleteParty()">حذف</button>
      <button class="cancel-btn" onclick="closePartyModal()">إلغاء</button>
      <button class="save-btn" onclick="saveParty()">حفظ</button>
    </div>
  </div>
</div>

<script>
/* ---------- مكتبة الرسمات (SVG خطية بسيطة) ---------- */
const ICONS = {
  'users':        '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4.5 2 4.5 5"/>',
  'globe':        '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18"/><path d="M12 3c-3 3-3 15 0 18"/>',
  'compass':      '<circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5"/>',
  'phone':        '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  'chart':        '<path d="M6 20v-8"/><path d="M12 20V5"/><path d="M18 20v-5"/><path d="M3 20h18"/>',
  'trend':        '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  'calendar':     '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16"/><path d="M8 3v4"/><path d="M16 3v4"/>',
  'archive':      '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/>',
  'check-circle': '<circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16 9"/>',
  'building':     '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2"/><path d="M13 7h2"/><path d="M9 11h2"/><path d="M13 11h2"/><path d="M10 21v-4h4v4"/>',
  'briefcase':    '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/>',
  'clipboard':    '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6"/><path d="M9 16h4"/>',
  'message':      '<path d="M4 5h16v11H9l-5 4z"/>',
  'printer':      '<path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><rect x="7" y="14" width="10" height="7"/>',
  'clock':        '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
  'alert':        '<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18v.5"/>'
};
function ico(name, size){
  size = size || 20;
  return '<svg class="ico-svg" viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';
}
function hydrateIcons(){
  document.querySelectorAll('[data-ico]').forEach(el=>{
    el.innerHTML = ico(el.dataset.ico, parseInt(el.dataset.size,10) || 20);
  });
}

/* ---------- البيانات الثابتة ---------- */
// i = اسم الرسمة، e = إيموجي يُستخدم فقط في نص التقرير
const BOXES = [
  {i:'users',        e:'👥', t:'الأطراف المعنية'},
  {i:'globe',        e:'🌍', t:'عناصر البيئة الداخلية والخارجية'},
  {i:'compass',      e:'🧭', t:'منهجية العملية'},
  {i:'phone',        e:'📞', t:'الاتصال والتواصل'},
  {i:'chart',        e:'📊', t:'التقارير الإدارية'},
  {i:'trend',        e:'📈', t:'التطور والتحسين'},
  {i:'calendar',     e:'📅', t:'جدولة الأحداث والمواعيد'},
  {i:'archive',      e:'🗂️', t:'الأرشفة والحفظ'},
  {i:'check-circle', e:'✅', t:'السجل والتدقيق النهائي'}
];
const BOX_STATUS = {new:'لم يبدأ', progress:'قيد التنفيذ', done:'مكتمل'};
const OP_STATUS  = {new:'جديدة', progress:'قيد التنفيذ', review:'قيد المراجعة', done:'مكتملة'};
const DEFAULT_CRITERIA = [
  'اكتمال بيانات الأطراف المعنية',
  'مراجعة المخاطر والتشريعات',
  'اعتماد المسؤول',
  'أرشفة الوثائق والعقود'
];
const PARTY_TYPES = ['مالك','عميل','مطوّر / مقاول','جهة حكومية','بنك / ممول','مكتب هندسي','شركة تسويق','أخرى'];

const STORE_KEY   = 'homran_ops_v2';
const COMPANY_KEY = 'homran_company_v1';
const DAY_MS = 24*60*60*1000;
const pad = n => String(n).padStart(2,'0');
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

let state = {currentId:null, ops:[]};
let company = {org:[], parties:[]};
let editingBox = null, editingOrg = null, editingParty = null;

/* ---------- التخزين ---------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  if(!state.ops || !state.ops.length){
    state = {currentId:null, ops:[]};
    addOperation();
  }
  if(!state.ops.find(o=>o.id===state.currentId)) state.currentId = state.ops[0].id;
}
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadCompany(){
  try{
    const raw = localStorage.getItem(COMPANY_KEY);
    if(raw) company = JSON.parse(raw);
  }catch(e){}
  if(!Array.isArray(company.org)) company.org = [];
  if(!Array.isArray(company.parties)) company.parties = [];
  if(!company.org.length){
    const root = uid();
    company.org = [
      {id:root, title:'المدير العام', name:'', parent:''},
      {id:uid(), title:'السكرتارية التنفيذية', name:'', parent:root}
    ];
  }
}
function persistCompany(){
  try{ localStorage.setItem(COMPANY_KEY, JSON.stringify(company)); }catch(e){}
}

/* ---------- الهيكل التنظيمي ---------- */
function descendants(id){
  const out = [];
  const walk = pid => company.org.filter(n=>n.parent===pid).forEach(n=>{ out.push(n.id); walk(n.id); });
  walk(id);
  return out;
}
function renderOrg(){
  const box = document.getElementById('org-tree');
  box.innerHTML = '';
  if(!company.org.length){
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'ما فيه مناصب بعد. أضيفي أول منصب.';
    box.appendChild(e); return;
  }
  const ids = new Set(company.org.map(n=>n.id));
  const roots = company.org.filter(n=>!n.parent || !ids.has(n.parent));

  function build(nodes){
    const ul = document.createElement('ul');
    nodes.forEach(n=>{
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'org-node';
      btn.onclick = ()=>openOrgModal(n.id);
      const t = document.createElement('span'); t.className = 'o-title'; t.textContent = n.title;
      btn.appendChild(t);
      if(n.name){
        const nm = document.createElement('span'); nm.className = 'o-name'; nm.textContent = n.name;
        btn.appendChild(nm);
      }
      li.appendChild(btn);
      const kids = company.org.filter(k=>k.parent===n.id);
      if(kids.length) li.appendChild(build(kids));
      ul.appendChild(li);
    });
    return ul;
  }
  box.appendChild(build(roots));
}
function openOrgModal(id){
  editingOrg = id || null;
  const node = id ? company.org.find(n=>n.id===id) : null;
  document.getElementById('org-modal-title').textContent = node ? 'تعديل منصب' : 'إضافة منصب';
  document.getElementById('org-title').value = node ? node.title : '';
  document.getElementById('org-name').value = node ? node.name : '';
  document.getElementById('org-del').style.display = node ? '' : 'none';

  const blocked = node ? new Set([node.id, ...descendants(node.id)]) : new Set();
  const sel = document.getElementById('org-parent');
  sel.innerHTML = '';
  const none = document.createElement('option');
  none.value = ''; none.textContent = '— أعلى مستوى (بدون تبعية) —';
  sel.appendChild(none);
  company.org.filter(n=>!blocked.has(n.id)).forEach(n=>{
    const o = document.createElement('option');
    o.value = n.id; o.textContent = n.title + (n.name ? ' — ' + n.name : '');
    sel.appendChild(o);
  });
  sel.value = node ? (node.parent || '') : '';
  document.getElementById('orgModal').classList.add('open');
  setTimeout(()=>document.getElementById('org-title').focus(),50);
}
function closeOrgModal(){
  document.getElementById('orgModal').classList.remove('open');
  editingOrg = null;
}
function saveOrg(){
  const title = document.getElementById('org-title').value.trim();
  const name = document.getElementById('org-name').value.trim();
  const parent = document.getElementById('org-parent').value;
  if(!title){ alert('اكتبي المسمى الوظيفي'); return; }
  if(editingOrg){
    const n = company.org.find(x=>x.id===editingOrg);
    n.title = title; n.name = name; n.parent = parent;
  }else{
    company.org.push({id:uid(), title, name, parent});
  }
  persistCompany(); renderOrg(); closeOrgModal();
}
function deleteOrg(){
  if(!editingOrg) return;
  const n = company.org.find(x=>x.id===editingOrg);
  if(!confirm('حذف منصب «' + n.title + '»؟ الأقسام التابعة له تنتقل للمستوى الأعلى.')) return;
  company.org.forEach(k=>{ if(k.parent===n.id) k.parent = n.parent; });
  company.org = company.org.filter(x=>x.id!==n.id);
  persistCompany(); renderOrg(); closeOrgModal();
}

/* ---------- الأطراف الثابتة ---------- */
function renderParties(){
  const grid = document.getElementById('parties-grid');
  grid.innerHTML = '';
  if(!company.parties.length){
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'ما فيه أطراف ثابتة بعد. أضيفي أول طرف.';
    grid.appendChild(e); return;
  }
  company.parties.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'party';
    card.tabIndex = 0;
    card.onclick = e=>{ if(e.target.tagName!=='A') openPartyModal(p.id); };
    card.onkeydown = e=>{ if(e.key==='Enter') openPartyModal(p.id); };

    const ty = document.createElement('span'); ty.className = 'p-type'; ty.textContent = p.type;
    const nm = document.createElement('span'); nm.className = 'p-name'; nm.textContent = p.name;
    card.append(ty,nm);

    if(p.phone){
      const a = document.createElement('a');
      a.href = 'tel:' + p.phone.replace(/[^\d+]/g,'');
      a.textContent = p.phone;
      card.appendChild(a);
    }
    if(p.note){
      const nt = document.createElement('span'); nt.className = 'p-note'; nt.textContent = p.note;
      card.appendChild(nt);
    }
    grid.appendChild(card);
  });
}
function openPartyModal(id){
  editingParty = id || null;
  const p = id ? company.parties.find(x=>x.id===id) : null;
  document.getElementById('party-modal-title').textContent = p ? 'تعديل طرف' : 'إضافة طرف';
  const sel = document.getElementById('party-type');
  sel.innerHTML = '';
  PARTY_TYPES.forEach(t=>{
    const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  sel.value = p ? p.type : PARTY_TYPES[0];
  document.getElementById('party-name').value = p ? p.name : '';
  document.getElementById('party-phone').value = p ? p.phone : '';
  document.getElementById('party-note').value = p ? p.note : '';
  document.getElementById('party-del').style.display = p ? '' : 'none';
  document.getElementById('partyModal').classList.add('open');
  setTimeout(()=>document.getElementById('party-name').focus(),50);
}
function closePartyModal(){
  document.getElementById('partyModal').classList.remove('open');
  editingParty = null;
}
function saveParty(){
  const name = document.getElementById('party-name').value.trim();
  const type = document.getElementById('party-type').value;
  const phone = document.getElementById('party-phone').value.trim();
  const note = document.getElementById('party-note').value.trim();
  if(!name){ alert('اكتبي اسم الطرف'); return; }
  if(editingParty){
    const p = company.parties.find(x=>x.id===editingParty);
    Object.assign(p,{name,type,phone,note});
  }else{
    company.parties.push({id:uid(), name, type, phone, note});
  }
  persistCompany(); renderParties(); closePartyModal();
}
function deleteParty(){
  if(!editingParty) return;
  const p = company.parties.find(x=>x.id===editingParty);
  if(!confirm('حذف «' + p.name + '»؟')) return;
  company.parties = company.parties.filter(x=>x.id!==p.id);
  persistCompany(); renderParties(); closePartyModal();
}

/* ---------- العمليات ---------- */
function genOpId(){
  const d = new Date();
  const base = `OP-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  let id = base, i = 2;
  while(state.ops.find(o=>o.id===id)) id = base + '-' + (i++);
  return id;
}
function addOperation(){
  const op = {
    id: genOpId(),
    start: Date.now(),
    status: 'new',
    boxes: {},
    criteria: DEFAULT_CRITERIA.map(t=>({text:t, checked:false}))
  };
  state.ops.unshift(op);
  state.currentId = op.id;
}
function currentOp(){ return state.ops.find(o=>o.id===state.currentId); }

function createNewOperation(){
  if(!confirm('بدء عملية جديدة؟ العملية الحالية تنحفظ في الأرشيف وتقدرين ترجعين لها.')) return;
  addOperation(); persist(); render();
}
function switchOperation(id){ state.currentId = id; persist(); render(); }

function unmetCount(op){ return op.criteria.filter(c=>!c.checked).length; }

function changeOpStatus(val){
  const op = currentOp();
  if(val==='done' && unmetCount(op)>0){
    alert('ما تقدرين تعتمدين العملية كمكتملة قبل ما تتحقق كل المعايير.\nالمتبقي: ' + unmetCount(op) + ' معيار');
    document.getElementById('op-status').value = op.status;
    return;
  }
  op.status = val;
  persist(); render();
}

/* ---------- المعايير ---------- */
function addCriterion(){
  const input = document.getElementById('crit-input');
  const text = input.value.trim();
  if(!text) return;
  const op = currentOp();
  op.criteria.push({text, checked:false});
  if(op.status==='done') op.status = 'review';
  input.value = '';
  persist(); render();
}
function toggleCriterion(i){
  const op = currentOp();
  op.criteria[i].checked = !op.criteria[i].checked;
  if(op.status==='done' && unmetCount(op)>0) op.status = 'review';
  persist(); render();
}
function deleteCriterion(i){
  if(!confirm('حذف هذا المعيار؟')) return;
  currentOp().criteria.splice(i,1);
  persist(); render();
}

/* ---------- العرض ---------- */
function fmtDate(ts){
  return new Date(ts).toLocaleString('ar-SA-u-ca-gregory',{dateStyle:'medium',timeStyle:'short'});
}

function render(){
  const op = currentOp();

  const sel = document.getElementById('op-select');
  sel.innerHTML = '';
  state.ops.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.id;
    opt.textContent = o.id + ' — ' + OP_STATUS[o.status];
    if(o.id===op.id) opt.selected = true;
    sel.appendChild(opt);
  });

  document.getElementById('op-status').value = op.status;
  const badge = document.getElementById('op-badge');
  badge.className = 'op-badge ' + op.status;
  badge.textContent = OP_STATUS[op.status];

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  BOXES.forEach((b,idx)=>{
    const n = idx+1;
    const d = op.boxes[n] || {text:'',status:'new'};
    const tile = document.createElement('button');
    tile.className = 'tile ' + (d.status!=='new' ? d.status : '');
    tile.setAttribute('aria-label', b.t);
    tile.onclick = ()=>openModal(n);

    const iconWrap = document.createElement('span');
    iconWrap.innerHTML = ico(b.i, 34);
    tile.appendChild(iconWrap);

    const dot = document.createElement('span'); dot.className = 'dot';
    tile.appendChild(dot);
    if(d.text){
      const note = document.createElement('span');
      note.className = 'has-note';
      tile.appendChild(note);
    }
    const tip = document.createElement('span');
    tip.className = 'tip'; tip.textContent = b.t;
    tile.appendChild(tip);
    grid.appendChild(tile);
  });

  const list = document.getElementById('crit-list');
  list.innerHTML = '';
  if(!op.criteria.length){
    const e = document.createElement('div');
    e.className = 'crit-empty'; e.textContent = 'ما فيه معايير بعد. أضيفي أول معيار.';
    list.appendChild(e);
  }
  op.criteria.forEach((c,i)=>{
    const row = document.createElement('div');
    row.className = 'crit-item' + (c.checked ? ' checked' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = c.checked;
    cb.onchange = ()=>toggleCriterion(i);
    const sp = document.createElement('span'); sp.textContent = c.text;
    const del = document.createElement('button');
    del.className = 'crit-del'; del.textContent = '✕'; del.setAttribute('aria-label','حذف');
    del.onclick = ()=>deleteCriterion(i);
    row.append(cb,sp,del);
    list.appendChild(row);
  });
  const met = op.criteria.length - unmetCount(op);
  document.getElementById('crit-count').textContent = `${met} / ${op.criteria.length} متحقق`;

  tick();
}

/* ---------- الوقت والعدّاد ---------- */
function tick(){
  document.getElementById('current-datetime').textContent =
    new Date().toLocaleString('ar-SA-u-ca-gregory',{dateStyle:'medium',timeStyle:'medium'});

  const op = currentOp(); if(!op) return;
  const left = op.start + DAY_MS - Date.now();
  const el = document.getElementById('countdown');
  if(left>0){
    const h = Math.floor(left/3600000), m = Math.floor(left%3600000/60000), s = Math.floor(left%60000/1000);
    el.innerHTML = ico('clock',16) + '<span>المتبقي: ' + pad(h) + ':' + pad(m) + ':' + pad(s) + '</span>';
    el.classList.remove('expired');
  }else{
    el.innerHTML = ico('alert',16) + '<span>انتهت مدة الـ 24 ساعة لهذي العملية</span>';
    el.classList.add('expired');
  }
}
setInterval(tick,1000);

/* ---------- نافذة مكوّن العملية ---------- */
function openModal(n){
  editingBox = n;
  const d = currentOp().boxes[n] || {text:'',status:'new'};
  document.getElementById('modal-ico').innerHTML = ico(BOXES[n-1].i, 30);
  document.getElementById('modal-title').textContent = `${n}. ${BOXES[n-1].t}`;
  document.getElementById('modal-textarea').value = d.text;
  document.getElementById('modal-status').value = d.status;
  document.getElementById('inputModal').classList.add('open');
  setTimeout(()=>document.getElementById('modal-textarea').focus(),50);
}
function closeModal(){
  document.getElementById('inputModal').classList.remove('open');
  editingBox = null;
}
function saveData(){
  if(editingBox){
    const text = document.getElementById('modal-textarea').value.trim();
    const status = document.getElementById('modal-status').value;
    const op = currentOp();
    op.boxes[editingBox] = {text, status, updated:Date.now()};
    if(op.status==='new') op.status = 'progress';
    persist(); render();
  }
  closeModal();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); closeOrgModal(); closePartyModal(); }
});

/* ---------- التقرير والمشاركة ---------- */
function orgText(){
  const ids = new Set(company.org.map(n=>n.id));
  const lines = [];
  function walk(pid, depth){
    company.org.filter(n=> pid===null ? (!n.parent || !ids.has(n.parent)) : n.parent===pid).forEach(n=>{
      lines.push('  '.repeat(depth) + '• ' + n.title + (n.name ? ' — ' + n.name : ''));
      walk(n.id, depth+1);
    });
  }
  walk(null,0);
  return lines.join('\n');
}
function buildReport(){
  const op = currentOp();
  let r = `📋 تقرير العملية ${op.id}\nالحالة: ${OP_STATUS[op.status]}\nبدأت: ${fmtDate(op.start)}\n━━━━━━━━━━\n`;
  r += `\n🏢 الهيكل التنظيمي:\n${orgText()}\n`;
  if(company.parties.length){
    r += `\n🤝 الأطراف الثابتة:\n`;
    company.parties.forEach(p=>{ r += `• ${p.name} (${p.type})${p.phone ? ' — ' + p.phone : ''}\n`; });
  }
  r += `\n━━━━━━━━━━\n\n✔️ المعايير (${op.criteria.length - unmetCount(op)}/${op.criteria.length}):\n`;
  op.criteria.forEach(c=>{ r += `${c.checked ? '☑' : '☐'} ${c.text}\n`; });
  r += '\n━━━━━━━━━━\n';
  BOXES.forEach((b,i)=>{
    const d = op.boxes[i+1];
    r += `\n${b.e} ${i+1}. ${b.t} [${BOX_STATUS[d ? d.status : 'new']}]\n${d && d.text ? d.text : '—'}\n`;
  });
  return r;
}
function copyReport(){
  const text = buildReport();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('تم نسخ التقرير')).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); alert('تم نسخ التقرير'); }
  catch(e){ alert('تعذّر النسخ، انسخي يدويًا'); }
  ta.remove();
}
function shareWhatsApp(){
  window.open('https://wa.me/?text=' + encodeURIComponent(buildReport()),'_blank');
}

/* ---------- التشغيل ---------- */
hydrateIcons();
loadCompany();
loadState();
renderOrg();
renderParties();
render();
</script>
